<!DOCTYPE html>
<html lang="fr" data-ambiance="nuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essai — écran du téléviseur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap">
<style>
  :root {
    --or: #c99a3f;
    --or-clair: #e8cd93;
    --ivoire: #f3ecdc;
    --nuit: #0a0705;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0705; color: #cdc4b2; font-family: 'Jost', system-ui, sans-serif; }
  #scene { position: relative; width: 100vw; height: calc(100vh - 62px); overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  video.b { opacity: 0; }

  /* ---- la dalle composee : elle vit DANS l'ecran du plan video ----
     Le rectangle de composition est projete par homographie sur les 4 coins
     mesures de la dalle. Rien n'est dessine hors de ce rectangle. */
  #ro-tv {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
    overflow: hidden;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    /* les tailles de texte se mesurent sur la DALLE, jamais sur la fenetre :
       sinon le titre change de taille quand on redimensionne le navigateur */
    container-type: size;
  }
  #ro-tv.is-on { opacity: 1; }

  /* l'allumage : la dalle passe du noir absolu a un fond nocturne tres sourd,
     avec la montee de lueur d'une vraie dalle retro-eclairee */
  #ro-tv .fond {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 120% 90% at 50% 42%, rgba(58, 40, 22, .95), rgba(12, 9, 6, .98) 62%, #070504 100%);
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  #ro-tv.allume .fond { opacity: 1; }

  #ro-tv .titre {
    position: absolute; left: 0; right: 0; top: 7.5%;
    margin: 0; text-align: center;
    font-family: 'Jost', sans-serif; font-weight: 300;
    font-size: 3.6cqw; letter-spacing: .3em; text-transform: uppercase;
    color: var(--or-clair);
    opacity: 0; transform: translateY(.5em);
    transition: opacity 1s ease, transform 1.2s cubic-bezier(.22,.61,.36,1);
    text-shadow: 0 0 2.2em rgba(201, 154, 63, .5);
  }
  #ro-tv.titre-on .titre { opacity: 1; transform: none; }

  /* un filet d'or sous le titre, qui se dessine du centre vers les bords.
     Il doit passer SOUS la ligne de base, pas au travers : le titre commence a
     7,5 % et fait ~3,6 cqw de corps, il finit donc vers 18 %. */
  #ro-tv .filet {
    position: absolute; top: 20%; left: 50%; width: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--or), transparent);
    transform: translateX(-50%);
    transition: width 1.4s cubic-bezier(.22,.61,.36,1);
  }
  #ro-tv.titre-on .filet { width: 52%; }

  /* --- les objets : un seul a la fois, plein cadre, sans carte ni grille --- */
  /* la zone libre sous le titre : l'objet occupe le haut, le nom ferme en bas.
     Une colonne flex evite que le nom et l'objet se chevauchent quand une photo
     est plus haute qu'une autre. */
  #ro-tv .objet {
    position: absolute; left: 6%; right: 6%; top: 23%; bottom: 5%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 3%;
    margin: 0;
    opacity: 0;
    transition: opacity .85s ease;
  }
  #ro-tv .objet.vu { opacity: 1; }
  /* Les objets sont DETOURES en code (matte sur la luminance, voir plus bas) :
     le fond de la photo devient reellement transparent. Plus de rectangle, plus
     de halo, et pas besoin de fusion « screen » qui eclaircissait tout. */
  #ro-tv .objet canvas {
    flex: 0 1 auto;
    min-height: 0;
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    filter: saturate(1.04) drop-shadow(0 1.2cqw 1.8cqw rgba(0, 0, 0, .8));
    transform: scale(1.05);
    transition: transform 3.4s cubic-bezier(.16,.62,.3,1);
  }
  #ro-tv .objet.vu canvas { transform: scale(1); }
  #ro-tv .objet figcaption {
    flex: 0 0 auto;
    text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400;
    font-size: 5.2cqw; line-height: 1.1;
    color: var(--ivoire);
    text-shadow: 0 .2em 1.2em rgba(0,0,0,.9);
    opacity: 0; transform: translateY(.28em);
    transition: opacity .7s ease .18s, transform .9s cubic-bezier(.22,.61,.36,1) .18s;
  }
  /* a la sortie, le nom part AVEC l'objet, sans retard : sinon il survit a
     l'image et se retrouve sous l'objet suivant */
  #ro-tv .objet:not(.vu) figcaption { transition-delay: 0s; }
  #ro-tv .objet.vu figcaption { opacity: 1; transform: none; }

  /* le VERRE : reflets par-dessus l'animation, comme sur une vraie dalle */
  #ro-tv .verre {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background:
      linear-gradient(104deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,.015) 20%, transparent 33%, rgba(255,255,255,.028) 51%, transparent 62%),
      radial-gradient(ellipse 110% 55% at 78% 2%, rgba(255,238,205,.05), transparent 58%);
  }

  /* barre d'essai */
  .bar { height: 62px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #14100c; border-top: 1px solid #2a2119; flex-wrap: wrap; }
  .bar button { font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 999px; border: 1px solid #3d3126; background: #1e1811; color: #d8cfbc; cursor: pointer; }
  .bar button:hover { border-color: var(--or); color: var(--or-clair); }
  .bar b { color: var(--or-clair); font-weight: 400; }
  .bar span { font-size: 12px; color: #8d8474; }
</style>
</head>
<body>

<div id="scene">
  <video id="va" class="a" muted playsinline preload="auto"></video>
  <video id="vb" class="b" muted playsinline preload="auto"></video>

  <div id="ro-tv" aria-hidden="true">
    <div class="fond"></div>
    <p class="titre">Ce que nous rachetons</p>
    <i class="filet"></i>
    <div id="objets"></div>
    <div class="verre"></div>
  </div>
</div>

<div class="bar">
  <button id="b-tout">▶ Séquence complète</button>
  <button id="b-hold">Écran seul (sans les plans)</button>
  <button id="b-quad">Afficher le contour de la dalle</button>
  <b id="etat">prêt</b>
  <span>aller 6 s · écran 18 s · retour 6 s</span>
</div>

<script>
/* ---- homographie : projette un rectangle DOM sur 4 coins ecran ---- */
function m3dQuad(w, h, q) {
  const adj = m => [
    m[4]*m[8]-m[5]*m[7], m[2]*m[7]-m[1]*m[8], m[1]*m[5]-m[2]*m[4],
    m[5]*m[6]-m[3]*m[8], m[0]*m[8]-m[2]*m[6], m[2]*m[3]-m[0]*m[5],
    m[3]*m[7]-m[4]*m[6], m[1]*m[6]-m[0]*m[7], m[0]*m[4]-m[1]*m[3],
  ];
  const mul = (a, b) => {
    const r = [];
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
      r[i*3+j] = a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j];
    return r;
  };
  const mulV = (m, v) => [
    m[0]*v[0]+m[1]*v[1]+m[2]*v[2],
    m[3]*v[0]+m[4]*v[1]+m[5]*v[2],
    m[6]*v[0]+m[7]*v[1]+m[8]*v[2],
  ];
  const base = (x1,y1,x2,y2,x3,y3,x4,y4) => {
    const m = [x1,x2,x3, y1,y2,y3, 1,1,1];
    const v = mulV(adj(m), [x4,y4,1]);
    return mul(m, [v[0],0,0, 0,v[1],0, 0,0,v[2]]);
  };
  const s = base(0,0, w,0, 0,h, w,h);
  const d = base(q[0].x,q[0].y, q[1].x,q[1].y, q[3].x,q[3].y, q[2].x,q[2].y);
  const t = mul(d, adj(s));
  for (let i = 0; i < 9; i++) t[i] /= t[8];
  return 'matrix3d(' + [t[0],t[3],0,t[6], t[1],t[4],0,t[7], 0,0,1,0, t[2],t[5],0,t[8]]
    .map(x => x.toFixed(7)).join(',') + ')';
}

/* ---- les 4 coins de la dalle, MESURES sur la derniere image de l'aller
   (fraction du cadre video 1728x964) ---- */
const QUAD = [
  { x: 0.1719, y: 0.1511 },
  { x: 0.7783, y: 0.1568 },
  { x: 0.7783, y: 0.7774 },
  { x: 0.1719, y: 0.7821 },
];

const CATS = [
  ['Bijoux en or', 'cat-bijoux-or.jpg'],
  ['Montres', 'cat-montres-luxe.jpg'],
  ['Pièces d’or', 'cat-pieces.jpg'],
  ['Lingots et lingotins', 'cat-lingots.jpg'],
  ['Débris d’or', 'cat-casses.jpg'],
  ['Argent et métaux précieux', 'cat-argente-etain.jpg'],
];

const scene = document.getElementById('scene');
const va = document.getElementById('va'), vb = document.getElementById('vb');
const ro = document.getElementById('ro-tv');
const bacObjets = document.getElementById('objets');
const etat = document.getElementById('etat');

bacObjets.innerHTML = CATS.map(c =>
  '<figure class="objet"><figcaption>' + c[0] + '</figcaption></figure>'
).join('');
const objets = [...bacObjets.querySelectorAll('.objet')];

/* ---- DETOURAGE EN CODE -------------------------------------------------
   Les six photos sont des objets clairs sur fond quasi noir. Plutot que de
   masquer le rectangle du fond (qui restait visible : masque elliptique, puis
   fusion « screen »), on en fait une vraie matte : l'opacite de chaque pixel
   est tiree de sa luminance.

   Les deux seuils ne sont PAS devines : ils sont calcules image par image a
   partir du niveau reel de son propre bord. Mesure faite sur les six : le fond
   median vaut 8 a 22 selon la photo, l'objet monte a 160-224 — l'ecart est
   franc, mais un seuil fixe raterait l'argenterie (sombre) ou mangerait les
   debris d'or (peu contrastes). D'ou le calcul par image. */
function detoure(url, alt) {
  const cv = document.createElement('canvas');
  cv.setAttribute('role', 'img');
  cv.setAttribute('aria-label', alt);
  const im = new Image();
  im.onload = () => {
    const W = im.naturalWidth, H = im.naturalHeight;
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(im, 0, 0);
    const dat = ctx.getImageData(0, 0, W, H), d = dat.data;
    const luma = i => 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];

    /* niveau du fond : mediane de la bordure de l'image */
    const bord = [];
    for (let x = 0; x < W; x += 4) { bord.push(luma((0 * W + x) * 4)); bord.push(luma(((H - 1) * W + x) * 4)); }
    for (let y = 0; y < H; y += 4) { bord.push(luma((y * W) * 4)); bord.push(luma((y * W + W - 1) * 4)); }
    bord.sort((a, b) => a - b);
    const fond = bord[bord.length >> 1];
    const bas = fond + 5, haut = fond + 40;

    for (let i = 0; i < d.length; i += 4) {
      const L = luma(i);
      let a = (L - bas) / (haut - bas);
      a = a <= 0 ? 0 : a >= 1 ? 1 : a * a * (3 - 2 * a);   /* transition douce */
      d[i + 3] = Math.round(a * 255);
    }
    /* Recadrage sur l'OBJET, pas sur la photo. Sans cela chaque objet apparait
       la ou le photographe l'a mis : la montre a droite, les lingots a gauche.
       On prend la boite de la matte (seuil bas, pour ne pas compter les reflets
       les plus tenus), avec une marge. */
    let x0 = W, x1 = -1, y0 = H, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 24) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    if (x1 < 0) { ctx.putImageData(dat, 0, 0); cv.dataset.pret = '1'; return; }
    const marge = Math.round(Math.max(x1 - x0, y1 - y0) * 0.06);
    x0 = Math.max(0, x0 - marge); y0 = Math.max(0, y0 - marge);
    x1 = Math.min(W - 1, x1 + marge); y1 = Math.min(H - 1, y1 + marge);

    const plein = document.createElement('canvas');
    plein.width = W; plein.height = H;
    plein.getContext('2d').putImageData(dat, 0, 0);
    cv.width = x1 - x0 + 1; cv.height = y1 - y0 + 1;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(plein, x0, y0, cv.width, cv.height, 0, 0, cv.width, cv.height);
    cv.dataset.pret = '1';
  };
  im.src = url;
  return cv;
}
CATS.forEach((c, i) => objets[i].prepend(detoure('assets/img/' + c[1], c[0])));

/* le rectangle de composition : on lui donne le rapport reel de la dalle pour
   que rien ne soit etire */
const DW = 1200, DH = Math.round(DW * (QUAD[3].y - QUAD[0].y) * 964 / ((QUAD[1].x - QUAD[0].x) * 1728));

function poser() {
  const sw = scene.clientWidth, sh = scene.clientHeight;
  const s = Math.max(sw / 1728, sh / 964);
  const W = 1728 * s, H = 964 * s, ox = (sw - W) / 2, oy = (sh - H) / 2;
  const q = QUAD.map(p => ({ x: ox + p.x * W, y: oy + p.y * H }));
  ro.style.width = DW + 'px';
  ro.style.height = DH + 'px';
  ro.style.transform = m3dQuad(DW, DH, q);
}
addEventListener('resize', poser);
poser();

let minuteurs = [];
const plus_tard = (ms, fn) => minuteurs.push(setTimeout(fn, ms));
const tout_arreter = () => { minuteurs.forEach(clearTimeout); minuteurs = []; };

function eteindre() {
  ro.classList.remove('is-on', 'allume', 'titre-on');
  objets.forEach(o => o.classList.remove('vu'));
}

/* la sequence de l'ecran, 18 s : allumage, titre, six objets, extinction */
function ecran(apres) {
  const T_ALLUME = 900, T_TITRE = 1500, T_OBJ = 2650, T_FIN = 1600;
  ro.classList.add('is-on');
  etat.textContent = 'la dalle s’allume';
  plus_tard(150, () => ro.classList.add('allume'));
  plus_tard(T_ALLUME, () => { ro.classList.add('titre-on'); etat.textContent = 'titre'; });
  /* Enchainement NET, pas de fondu croise. En croise, l'objet suivant
     apparaissait pendant que le nom precedent s'effacait encore : on lisait
     « Bijoux en or » sous une montre. Chaque objet s'efface donc entierement
     avant que le suivant n'arrive. */
  const T_SORTIE = 620;
  let t = T_ALLUME + T_TITRE;
  objets.forEach((o, i) => {
    plus_tard(t, () => {
      o.classList.add('vu');
      etat.textContent = (i + 1) + '/6 — ' + CATS[i][0];
    });
    plus_tard(t + T_OBJ - T_SORTIE, () => o.classList.remove('vu'));
    t += T_OBJ;
  });
  plus_tard(t, () => {
    objets.forEach(x => x.classList.remove('vu'));
    ro.classList.remove('titre-on');
    etat.textContent = 'l’écran s’éteint';
  });
  plus_tard(t + T_FIN, () => { ro.classList.remove('allume'); });
  plus_tard(t + T_FIN + 700, () => { eteindre(); if (apres) apres(); });
}

function joue(v, src, apres) {
  v.src = 'assets/video/' + src;
  v.style.opacity = '1';
  (v === va ? vb : va).style.opacity = '0';
  v.currentTime = 0;
  const fin = () => { v.removeEventListener('ended', fin); apres(); };
  v.addEventListener('ended', fin);
  v.play();
}

document.getElementById('b-tout').onclick = () => {
  tout_arreter(); eteindre();
  etat.textContent = 'aller — la caméra avance';
  joue(va, 'v4-m3a-tv-aller-nuit.mp4', () => {
    /* la video reste sur sa derniere image pendant toute la scene d'ecran */
    ecran(() => {
      etat.textContent = 'retour — la caméra recule';
      joue(vb, 'v4-m3b-tv-retour-nuit.mp4', () => { etat.textContent = 'fin'; });
    });
  });
};

document.getElementById('b-hold').onclick = () => {
  tout_arreter(); eteindre();
  va.src = 'assets/video/v4-m3a-tv-aller-nuit.mp4';
  va.style.opacity = '1'; vb.style.opacity = '0';
  va.addEventListener('loadeddata', function once() {
    va.removeEventListener('loadeddata', once);
    va.currentTime = Math.max(0, va.duration - 0.05);
    plus_tard(220, () => ecran(() => { etat.textContent = 'fin'; }));
  });
};

let contour = false;
document.getElementById('b-quad').onclick = () => {
  contour = !contour;
  ro.style.outline = contour ? '2px solid #e8cd93' : '';
  ro.style.opacity = contour ? '1' : '';
  if (contour) { ro.classList.add('is-on'); }
};
</script>
</body>
</html>
